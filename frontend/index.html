<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhiloSearch — Semantic search across classic philosophical texts</title>
    <meta name="description" content="Semantic search and cited answers across classic philosophical texts." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the theme before first paint so there's no light flash in dark
      // mode: the saved choice from the header toggle, else the system setting.
      // Keep the key in sync with src/lib/theme.ts.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("philosearch:theme");
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <style>
      /* Fallback styles in case Tailwind doesn't load */
      html, body, #root {
        min-height: 100vh;
        background-color: #f6f7f9;
        margin: 0;
        padding: 0;
      }
      body {
        color: #1f2937;
        font-family: system-ui, -apple-system, sans-serif;
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #0f1216;
        color: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
